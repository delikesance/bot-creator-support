<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Support — Panel admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' shape-rendering='crispEdges'%3E%3Cg fill='%23F4F0EA'%3E%3Cpath d='M3 1h6v1h1v1h1v6h-1v1H9v1H3v-1H2V9H1V3h1V2h1z'/%3E%3C/g%3E%3Cg fill='%2309090C'%3E%3Crect x='3.4' y='4.8' width='1.6' height='1.6'/%3E%3Crect x='6.8' y='4.8' width='1.6' height='1.6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --bg:#0B0B0C; --surface:#141415; --raised:#1C1C1E; --border:#2A2A2D;
    --ink:#F4F2EE; --ink-2:#C9C7C2; --muted:#AEACA8;
    --accent:#7C5CF0; --accent-ink:#A78BFA; --accent-line:#4A3C8C; --accent-deep:#1B1730; --hero:#3A2E7A;
    --amber:#FFB86B; --amber-line:#6B4E1F;
    --danger:#FF8A8A; --danger-line:#B3262B; --danger-soft:#1F1112;
    --sans:"Geist",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
  button,input,textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--accent-ink); outline-offset:2px; }
  .mono { font-family:var(--mono); }
  .eyebrow { font:500 12px/1.3 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }

  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes slide { from { opacity:0; transform:translateX(14px); } to { opacity:1; transform:none; } }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
  @keyframes pop { 0% { transform:scale(1); } 40% { transform:scale(1.12); } 100% { transform:scale(1); } }
  @keyframes toast { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  @keyframes shimmer { from { background-position:200% 0; } to { background-position:-200% 0; } }
  .rise { animation:rise .45s var(--ease) both; animation-delay:calc(var(--i,0) * 45ms); }
  .slide { animation:slide .3s var(--ease) both; }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }

  header.top { height:64px; padding:0 32px; display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--border); position:sticky; top:0; background:rgba(11,11,12,.92); backdrop-filter:blur(8px); z-index:5; }
  .live { display:flex; align-items:center; gap:8px; font:500 12px var(--mono); letter-spacing:.08em; color:var(--muted); }
  .live::before { content:""; width:8px; height:8px; background:var(--accent-ink); animation:pulse 1.8s ease-in-out infinite; }
  .live.off::before { background:var(--danger); animation:none; }
  .bibi { display:inline-block; flex:none; position:relative; vertical-align:middle; }
  .bibi svg { display:block; overflow:visible; }
  .bibi .body { transform-origin:50% 85%; }
  .bibi.move.idle .body { animation:bbIdle 2.8s ease-in-out infinite; }
  .bibi.move.welcome .body { animation:bbWelcome 2s ease-in-out infinite; }
  .bibi .blink { transform-box:fill-box; transform-origin:center; }
  .bibi.move.idle .blink { animation:bbBlink 4.2s ease-in-out infinite; }
  @keyframes bbIdle { 0%,100% { transform:translateY(0) scale(1,1); } 50% { transform:translateY(-4%) scale(.98,1.02); } }
  @keyframes bbWelcome { 0%,100% { transform:translateY(0) rotate(0); } 30% { transform:translateY(-5%) rotate(-7deg) scale(1.03); } 70% { transform:translateY(-3.5%) rotate(7deg) scale(1.03); } }
  @keyframes bbBlink { 0%,92%,100% { transform:scaleY(1); } 95% { transform:scaleY(.1); } }
  .guild { position:relative; }
  .guild-btn { height:40px; padding:0 12px 0 8px; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:2px; font-weight:600; max-width:280px; transition:border-color .15s; }
  .guild-btn:hover, .guild-btn[aria-expanded="true"] { border-color:var(--accent-line); }
  .guild-btn .chev { width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg) translate(-2px,-2px); transition:transform .2s var(--ease); margin-left:2px; }
  .guild-btn[aria-expanded="true"] .chev { transform:rotate(-135deg) translate(-2px,-2px); }
  .guild-static { cursor:default; }
  .gname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gicon { width:24px; height:24px; border-radius:999px; background:var(--border); object-fit:cover; display:flex; align-items:center; justify-content:center; font:700 11px var(--mono); flex:none; overflow:hidden; }
  .gcount { font:700 11px var(--mono); background:var(--accent); color:#fff; padding:2px 6px; border-radius:2px; flex:none; }
  .menu { position:absolute; top:calc(100% + 6px); left:0; min-width:280px; max-width:92vw; background:var(--raised); border:1px solid var(--border); border-radius:2px; box-shadow:0 12px 32px rgba(0,0,0,.5); padding:6px; z-index:15; animation:rise .18s var(--ease) both; }
  .menu .eyebrow { padding:8px 10px 6px; }
  .opt { width:100%; display:flex; align-items:center; gap:10px; padding:10px; background:none; border:0; border-radius:2px; text-align:left; transition:background .12s; }
  .opt:hover, .opt:focus-visible { background:var(--surface); }
  .opt[aria-checked="true"] { background:var(--accent-deep); box-shadow:inset 3px 0 0 var(--accent); }
  .opt .gname { flex:1; font-weight:600; }
  .opt small { color:var(--muted); font-size:12px; }
  .msg.fresh { animation:rise .28s var(--ease) both; }
  .spacer { flex:1; }

  .btn { height:36px; padding:0 16px; background:var(--raised); border:1px solid var(--border); border-radius:2px; font-weight:600; font-size:14px; transition:transform .12s, box-shadow .12s, border-color .15s, background .15s; white-space:nowrap; }
  .btn:hover { border-color:var(--accent-line); transform:translate(-1px,-1px); }
  .btn:active { transform:translate(1px,1px); }
  .btn.ghost { background:transparent; }
  .btn.hero { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:2px 2px 0 var(--hero); }
  .btn.hero:hover { box-shadow:3px 3px 0 var(--hero); }
  .btn.hero:active { box-shadow:none; transform:translate(2px,2px); }
  .btn.caution { color:var(--danger); border-color:var(--danger-line); background:transparent; }
  .btn.caution:hover { background:var(--danger-soft); }
  .btn[disabled] { opacity:.45; pointer-events:none; }
  .btn.busy { opacity:.6; pointer-events:none; }

  main { max-width:1280px; margin:0 auto; padding:32px; display:flex; flex-direction:column; gap:24px; }
  h1.display { margin:4px 0 0; font-size:30px; line-height:1.1; font-weight:700; letter-spacing:-.02em; }
  .head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .search { height:48px; flex:1 1 280px; max-width:420px; min-width:0; padding:0 16px; background:var(--surface); border:1px solid var(--border); border-radius:2px; display:flex; align-items:center; gap:10px; color:var(--muted); transition:border-color .15s; }
  .search:focus-within { border-color:var(--accent-ink); }
  .search input { flex:1; background:none; border:0; outline:0; color:var(--ink); min-width:0; }
  .search kbd { font:500 11px var(--mono); border:1px solid var(--border); padding:2px 6px; border-radius:2px; }

  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
  .kpi { text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:2px; padding:20px; display:flex; flex-direction:column; gap:12px; transition:border-color .2s, transform .2s var(--ease), background .2s; }
  .kpi:hover { border-color:var(--accent-line); transform:translateY(-2px); }
  .kpi.active { border-color:var(--accent-ink); background:var(--accent-deep); }
  .kpi .n { font:700 28px/1 var(--mono); }
  .kpi .n.pop { animation:pop .35s var(--ease); }
  .kpi small { font-size:13px; color:var(--ink-2); }
  .sq { width:8px; height:8px; background:var(--c); display:inline-block; flex:none; }
  .lbl { display:flex; align-items:center; gap:8px; }

  .layout { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start; }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:2px; min-width:0; }
  .list { flex:1 1 380px; }
  .detail { flex:1.5 1 480px; display:flex; flex-direction:column; position:sticky; top:84px; max-height:calc(100vh - 108px); }
  @media (max-width:640px) { header.top .eyebrow, .search kbd { display:none; } .search { max-width:none; } }
  @media (max-width:900px) { .detail { position:static; max-height:none; } main { padding:20px 16px; } header.top { padding:0 16px; } }
  .tabs { display:flex; gap:4px; padding:12px; border-bottom:1px solid var(--border); overflow-x:auto; }
  .tab { height:36px; padding:0 14px; background:transparent; color:var(--muted); border:1px solid transparent; border-radius:2px; font-weight:600; font-size:14px; transition:color .15s, background .15s, border-color .15s; white-space:nowrap; }
  .tab:hover { color:var(--ink); }
  .tab.on { background:var(--accent-deep); color:var(--accent-ink); border-color:var(--accent-line); }
  .wait { display:inline-flex; align-items:center; gap:6px; font:600 11px var(--mono); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
  .wait i { width:8px; height:8px; border:2px solid currentColor; flex:none; }
  .wait.support { color:var(--accent-ink); } .wait.support i { background:currentColor; }
  .wait.customer { color:var(--muted); }
  .row .t small .wait { margin-left:8px; }
  .chips { display:flex; gap:8px; padding:10px 12px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .chip { height:30px; padding:0 12px; display:inline-flex; align-items:center; gap:8px; background:transparent; border:1px solid var(--border); border-radius:2px; font-size:13px; font-weight:600; color:var(--muted); transition:color .15s, border-color .15s, background .15s; }
  .chip:hover { color:var(--ink); border-color:var(--accent-line); }
  .chip.on { background:var(--accent-deep); color:var(--accent-ink); border-color:var(--accent-line); }
  .chip.customer.on { background:var(--raised); color:var(--ink); }
  .chip b { font:500 12px var(--mono); opacity:.85; }
  .tab span { font:500 12px var(--mono); margin-left:6px; opacity:.8; }

  .row { width:100%; display:flex; align-items:center; gap:14px; padding:14px 16px; border:0; border-bottom:1px solid var(--border); background:none; text-align:left; transition:background .15s, box-shadow .2s; }
  .row:last-child { border-bottom:0; }
  .row:hover { background:var(--raised); }
  .row.sel { background:var(--raised); box-shadow:inset 3px 0 0 var(--accent); }
  .row.flash { animation:flash 1s ease-out; }
  @keyframes flash { from { background:var(--accent-deep); } to { background:transparent; } }
  .avatar { width:36px; height:36px; border-radius:999px; background:var(--border); display:flex; align-items:center; justify-content:center; font-weight:700; flex:none; text-transform:uppercase; }
  .row .t { flex:1; min-width:0; }
  .row .t b { display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .t small { color:var(--muted); font-size:13px; }
  .tag { font:700 11px var(--mono); letter-spacing:.08em; color:var(--c); display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .badge { padding:4px 8px; border:1px solid var(--c); color:var(--c); font:700 11px var(--mono); letter-spacing:.08em; border-radius:2px; }
  .empty { padding:48px 24px; text-align:center; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:14px; }
  .skel { height:64px; margin:8px 12px; background:linear-gradient(90deg,var(--surface) 25%,var(--raised) 50%,var(--surface) 75%); background-size:200% 100%; animation:shimmer 1.4s linear infinite; }

  .dh { padding:20px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:12px; flex:none; }
  .dh h2 { margin:0; font-size:22px; line-height:1.2; font-weight:600; overflow-wrap:anywhere; }
  .dh .meta { font-size:13px; color:var(--ink-2); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .msgs { padding:20px; display:flex; flex-direction:column; gap:14px; overflow:auto; min-height:220px; flex:1; scroll-behavior:smooth; }
  .msg { max-width:82%; animation:rise .3s var(--ease) both; }
  .msg .who { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .msg .body { background:var(--raised); border:1px solid var(--border); border-radius:2px; padding:10px 14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg .body a { color:var(--accent-ink); text-decoration:underline; text-underline-offset:3px; }
  .att { display:block; margin-top:8px; }
  .att:first-child { margin-top:0; }
  .att img { display:block; max-width:min(100%, 420px); max-height:320px; border:1px solid var(--border); border-radius:2px; background:var(--bg); object-fit:contain; transition:border-color .15s; }
  .att:hover img { border-color:var(--accent-line); }
  .att { cursor:zoom-in; }
  .lb { position:fixed; inset:0; z-index:60; background:rgba(8,8,9,.95); display:flex; align-items:center; justify-content:center; padding:72px 16px 24px; animation:lbfade .18s ease both; }
  .lb-bar { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:10px; padding:14px 20px; }
  .lb-bar .btn { display:inline-flex; align-items:center; color:var(--text, #fff); text-decoration:none; background:var(--raised); }
  .lb-count { font:500 12px var(--mono); letter-spacing:.08em; color:var(--muted); }
  .lb-img { max-width:min(96vw,1400px); max-height:100%; object-fit:contain; border:1px solid var(--border); background:var(--bg); cursor:default; }
  .lb-img.in { animation:lbzoom .22s var(--ease) both; }
  .lb-nav { position:absolute; top:50%; transform:translateY(-50%); width:48px; height:64px; font-size:32px; line-height:1; background:var(--surface); color:var(--text, #fff); border:1px solid var(--border); border-radius:2px; transition:border-color .15s; }
  .lb-nav:hover, .lb-nav:focus-visible { border-color:var(--accent-line); }
  .lb-nav.prev { left:16px; } .lb-nav.next { right:16px; }
  @keyframes lbfade { from { opacity:0; } to { opacity:1; } }
  @keyframes lbzoom { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:none; } }
  .att.broken { font-size:13px; color:var(--muted); }
  .msg.panel { align-self:flex-end; } .msg.panel .who { text-align:right; }
  .msg.panel .body { background:var(--accent-deep); border-color:var(--accent-line); box-shadow:3px 3px 0 var(--accent); }
  .msg.system { align-self:center; max-width:100%; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .composer { padding:16px 20px; border-top:1px solid var(--border); display:flex; gap:10px; align-items:flex-end; flex:none; }
  .composer textarea { flex:1; min-height:48px; max-height:160px; resize:vertical; padding:12px 16px; background:var(--bg); border:1px solid var(--border); border-radius:2px; transition:border-color .15s; }
  .composer textarea:focus { outline:0; border-color:var(--accent-ink); }
  .composer .btn { height:48px; padding:0 22px; font-size:15px; }
  .hint { font-size:12px; color:var(--muted); padding:0 20px 14px; }

  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login { width:100%; max-width:380px; padding:32px; display:flex; flex-direction:column; gap:16px; animation:rise .5s var(--ease) both; }
  .login h1 { margin:0; font-size:22px; font-weight:600; }
  .login label { font-weight:600; }
  .login input { width:100%; height:48px; padding:0 16px; background:var(--bg); border:1px solid var(--border); border-radius:2px; margin-top:6px; }
  .login input:focus { outline:0; border-color:var(--accent-ink); }
  .login .btn { height:48px; }
  .err { color:var(--danger); min-height:1.4em; font-size:14px; }
  .shake { animation:shake .35s; }
  @keyframes shake { 20%,60% { transform:translateX(-6px); } 40%,80% { transform:translateX(6px); } }

  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:20px; z-index:20; animation:fade .2s both; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  .dialog { background:var(--raised); border:1px solid var(--border); border-radius:2px; padding:20px; max-width:400px; width:100%; display:flex; flex-direction:column; gap:12px; animation:rise .25s var(--ease) both; }
  .dialog h3 { margin:0; font-size:20px; font-weight:600; }
  .dialog p { margin:0; color:var(--ink-2); }
  .dialog .actions { justify-content:flex-end; margin-top:6px; }
  .toast { display:flex; align-items:center; gap:12px; position:fixed; bottom:20px; right:20px; max-width:360px; background:var(--raised); border:1px solid var(--danger-line); border-left-width:4px; padding:12px 16px; border-radius:2px; animation:toast .3s var(--ease) both; z-index:30; }
  .toast.ok { border-color:var(--accent-line); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const STATUS = {
  open:        { label:"Ouvert",   color:"#A78BFA", hint:"En attente d'une réponse" },
  in_progress: { label:"En cours", color:"#FFB86B", hint:"Pris en charge par l'équipe" },
  closed:      { label:"Fermé",    color:"#AEACA8", hint:"Résolus" },
};
const TABS = [["", "Tous"], ["open", "Ouverts"], ["in_progress", "En cours"], ["closed", "Fermés"]];
const state = { wait:"", awaiting:{support:0,customer:0}, me:null, guilds:[], guild:null, menu:false, filter:"", query:"", tickets:[], stats:{open:0,in_progress:0,closed:0}, selected:null, detail:null, loading:true, online:true, changed:new Set(), animate:true };
const app = document.getElementById("app");
let lastStats = null;

function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}

async function api(path, opts = {}) {
  const res = await fetch("/api" + path, { headers:{ "content-type":"application/json" }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== "/login") { renderLogin(); throw new Error("auth"); }
  if (!res.ok) throw new Error(data.error || "Erreur " + res.status);
  return data;
}
const post = (path, body) => api(path, { method:"POST", body: body ? JSON.stringify(body) : undefined });

function toast(msg, ok = false) {
  const t = h("div", { class:"toast" + (ok ? " ok" : ""), role:"status" }, bibi(ok ? "success" : "error", 24), msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 4000);
}

function ago(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return "à l'instant";
  if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
  return new Date(ts).toLocaleDateString("fr-FR", { day:"numeric", month:"short" });
}
const clock = (ts) => new Date(ts).toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });

function confirmDialog(title, text, confirmLabel) {
  return new Promise((resolve) => {
    const done = (v) => { scrim.remove(); resolve(v); };
    const ok = h("button", { class:"btn caution", onclick:() => done(true) }, confirmLabel);
    const scrim = h("div", { class:"scrim", onclick:(e) => e.target === scrim && done(false), onkeydown:(e) => e.key === "Escape" && done(false) },
      h("div", { class:"dialog", role:"dialog", "aria-modal":"true" },
        h("h3", {}, title), h("p", {}, text),
        h("div", { class:"actions" }, h("button", { class:"btn ghost", onclick:() => done(false) }, "Annuler"), ok)));
    document.body.append(scrim);
    ok.focus();
  });
}

/* ---------- Bibi (mascotte du design system, grille 12, coins en escalier) ---------- */
const BIBI = {
  idle:    { g:"#F4F0EA", i:"#09090C", r:[[3.4,4.8,1.6,1.6],[6.8,4.8,1.6,1.6]], blink:true },
  welcome: { g:"#7C5CF0", i:"#09090C", r:[[3.2,5.4,2,.55]], l:["6.8,6.2 7.8,4.8 8.8,6.2"] },

async function load() {
  state.me ??= await api("/me").catch((e) => { if (e.message === "auth") throw e; return null; });
  state.guilds = (await api("/guilds")).guilds;
  if (!state.guilds.some((g) => g.id === state.guild)) {

  const data = await api("/tickets?guild=" + encodeURIComponent(state.guild));
  const prev = new Map(state.tickets.map((t) => [t.id, t.status + t.updatedAt]));
  state.changed = new Set(state.tickets.length ? data.tickets.filter((t) => prev.get(t.id) !== t.status + t.updatedAt).map((t) => t.id) : []);

function renderText(text) {
  const out = []; const imgs = [];
  let last = 0;
  for (const m of text.matchAll(URL_RE)) {
    const url = m[0].replace(/[).,;!?]+$/, "");
    out.push(text.slice(last, m.index));
    last = m.index + url.length;
    if (isImage(url)) {
      const img = h("img", { src:url, alt:"Image jointe", loading:"lazy", referrerpolicy:"no-referrer" });
      const a = h("a", { class:"att", href:url, target:"_blank", rel:"noopener noreferrer", title:"Ouvrir l'image" }, img);
      // Clic simple : visionneuse du panel. Ctrl/Cmd/clic milieu gardent l'ouverture dans un onglet.
      a.addEventListener("click", (e) => {
        if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;
        e.preventDefault(); openLightbox(url);
      });
      img.addEventListener("error", () => { a.classList.add("broken"); a.replaceChildren(document.createTextNode("Image indisponible (lien expiré) : " + url)); });
      imgs.push(a);
    } else {
      out.push(h("a", { href:url, target:"_blank", rel:"noopener noreferrer" }, url));
    }
  }
  out.push(text.slice(last));
  const rest = out.filter((x) => x !== "");
  // Message composé uniquement d'images : pas de texte vide autour.
  const hasText = rest.some((x) => typeof x !== "string" || x.trim());
  return [...(hasText ? rest : []), ...imgs];
}

let events = null, eventsGuild = null, pending = null, slow = 0;

  events?.close(); events = null;
  if (!state.guild || typeof EventSource === "undefined") return;
  eventsGuild = state.guild;

  es.onmessage = () => { clearTimeout(pending); pending = setTimeout(() => refresh(), 120); };
  es.onopen = () => { state.online = true; refresh(); };
  es.onerror = () => { state.online = false; document.querySelector(".live")?.classList.add("off"); };
}

  }
  if (e.key === "Escape" && state.menu) { state.menu = false; renderMain(); document.getElementById("guild-btn")?.focus(); }
  if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName ?? "")) { e.preventDefault(); document.getElementById("q")?.focus(); }
});

(async () => {
  renderMain();
  try { await load(); state.loading = false; state.animate = true; renderMain(); } catch (e) { if (e.message !== "auth") { state.loading = false; renderMain(); } }
  connectEvents();
  // Filet de sécurité : le flux temps réel fait l'essentiel, ceci rattrape une coupure.
  setInterval(() => {
    if (!document.getElementById("q")) return;
    if (events && events.readyState === 1) { if (++slow % 6 === 0) refresh(); } else { connectEvents(); refresh(); }
  }, 5000);
})();
</script>
</body>
